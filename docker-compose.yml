services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shrinkx-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: url_shortener
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432

      BASE_URL: http://localhost:5000

      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092

    depends_on:
      - postgres
      - redis
      - kafka

  analytics-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shrinkx-analytics-consumer
    restart: unless-stopped

    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: url_shortener
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432

      KAFKA_BROKER: kafka:9092

    depends_on:
      - postgres
      - kafka

    command: ["node", "consumer.js"]

  postgres:
    image: postgres:18
    container_name: shrinkx-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: url_shortener

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


  redis:
    image: redis:7
    container_name: shrinkx-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  kafka:
    image: apache/kafka:4.3.1
    container_name: shrinkx-kafka
    restart: unless-stopped

    ports:
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data


volumes:
  postgres_data:
  redis_data:
  kafka_data: